[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-radar"
dynamic = ["version"]
description = "Understand any codebase in 60 seconds: health score, risk findings, churn hotspots and a self-contained HTML dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kele" }]
keywords = ["static-analysis", "codebase", "developer-tools", "cli", "code-quality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
repo-radar = "repo_radar.cli:main"

[project.urls]
Homepage = "https://github.com/kele-tao/repo-radar"
Issues = "https://github.com/kele-tao/repo-radar/issues"

[tool.setuptools.dynamic]
version = { attr = "repo_radar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:repo_radar.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E501", "SIM115", "I001"]
"benchmarks/*" = ["E501"]
"src/repo_radar/htmlreport.py" = ["E501"]
"src/repo_radar/render.py" = ["E501"]