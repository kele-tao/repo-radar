name: Feature request
description: Suggest a new rule, metric or output format.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not answer today when you look at a codebase?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Command, flag or output you would expect.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scoring
        - rules
        - git history
        - import graph
        - report output
        - other
    validations:
      required: true
